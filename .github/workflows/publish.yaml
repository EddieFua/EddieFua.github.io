name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p public/assets/css public/assets/js
          cp index.html 404.html about.html robots.txt sitemap.xml .nojekyll public/
          cp -R publications experience contact about images public/
          cp assets/css/home.css public/assets/css/
          cp assets/js/home.js public/assets/js/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
